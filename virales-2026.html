a de una garrapata infectada. La bacteria había entrado en su cuerpo mientras dormía por contacto directo y los médicos actuaron de inmediato. Pero el daño ya estaba hecho. Estuvo una semana al borde de la muerte, pero logró sobrevivir su hígado y su sistema inmunológico quedaron severamente afectados por esta infección. Y aquí viene lo más importante. No basta acompañar a tu perro. Las garrapatas pueden esconderse, reproducirse y transmitir enfermedades mortales sin que te des cuenta. Y si amas a tu mascota, por favor, te espera así tal de forma regular. Revisa su piel y su cama. Evita que duerma contigo. Y ante cualquier síntoma extraño, actúa rápido. Comparte esta historia con alguien que tenga perros en casa. Porque una garrapata es pequeña, pero el daño que puede causar es enorme. El amor por tu mascota no se demuestra con descuidos. Se demuestra con prevención."},{"month":"FEBRERO","cat":"FELIPE","cat_label":"Felipe (Salud & Sociedad)","date":"07/02/2026","title":"Perdió la vista por un error que todas cometemos","fb_link":"https://www.facebook.com/reel/818521354577833","fb_views":22569533,"ig_link":"https://www.instagram.com/reel/DUed6STkgZR/","ig_views":6379322,"tt_link":"https://www.tiktok.com/@badabun/video/7604221567136009492?is\\_from\\_webapp=1\\&sender\\_device=pc\\&web\\_id=7569378312473298443","tt_views":8300000,"total":37248855,"guion":"Perdió la vista por un error que todos cometemos. Esto no es exageración, esto sí pasó y le puede pasar a cualquiera. Una joven perdió la vista de un ojo por algo que miles hacen cada semana sin pensarlo dos veces. Fue a ponerse extensiones de pestaños, nada raro, nada extremo, nada que sonar a peligroso. Pero antes de seguir, comparte este video con tus amigas, hermanas o familiares, porque este error es más común de lo que crees y puede salir carizo. Todo empezó como siempre, su la chista de confianza no tenía espasa. Así que decidió ir con alguien nuevo. Durante la aplicación a la ardor era brutal, no en comodidad esta información. Alguien podría evitar una tragedia simplemente, sabiendo esto."},{"month":"FEBRERO","cat":"FELIPE","cat_label":"Felipe (Salud & Sociedad)","date":"05/02/2026","title":"La niña de 10 años que caminaba 1 km con una sola pierna para poder estudiar","fb_link":"https://www.facebook.com/reel/1147436113973381","fb_views":16318693,"ig_link":"https://www.instagram.com/reel/DUZNW2dCmzS/","ig_views":927286,"tt_link":"https://www.tiktok.com/@badabun/video/7603515559417761044?is\\_from\\_webapp=1\\&sender\\_device=pc\\&web\\_id=7569378312473298443","tt_views":2300000,"total":19545979,"guion":"La niña de 10 años que caminaba un kilómetro con una sola pierna para poder estudiar. Esta historia no debería existir, pero existe y pasó de verdad. Una niña de apenas 10 años con una sola pierna caminaba todos los días un kilómetro para poder ir a la escuela. No había poche, no había bicicleta y no había quien la cargara. Solo ella, su mochila lombro y el camino de tierra, el sol, el polvo y el dolor. Mientras otros niños llegaban en moto, en vis y en carro, ella avanzaba sola saltando, cayéndose y levantándose otra vez. Y aun así no faltaba a clases. Nunca se rindió porque su sueño era más grande que su cuerpo y antes de seguir comparte este vídeo. Porque hay historias que merecen llegar más lejos que nosotros. Tantólo un día a alguien la grabó, subió el vídeo a Redes y por primera vez el mundo la volvió a ver. Ese vídeo llegó hasta el actor Sonu Sud y cuando él avió no dudo. No preguntó, no prometió él simplemente actuó, le mandó un triciclo especial y una protesiz nueva. Por primera vez la niña dejó de avanzar con dolor y empezó a avanzar con esperanza. Ya no era solo sobrevivir el camino, era disfrutarlo, era llegar a la escuela sin miedo sin caerse sin sufrir. Y es que a veces los milagros no llegan como arte de magia, llegan como personas que deciden no mirar hacia otro lado. Si es la historia te apretó el pecho, si te movió algo por dentro, compártela. Y más gente "ABRIL","cat":"FELIPE","cat_label":"Felipe (Salud & Sociedad)","date":"03/04/2026","title":"Así es una aguja epidural. Por eso las mujeres sufren tanto. Apóyalas.","fb_link":"https://facebook.com/reel/962912109531504/","fb_views":23000000,"ig_link":"https://www.instagram.com/reel/DWrVsZyDKFV/?utm\\_source=ig\\_web\\_copy\\_link\\&igsh=NTc4MTIwNjQ2YQ==","ig_views":0,"tt_link":"21.000.000","tt_views":0,"total":23000000,"guion":"Así es una aguja epidural, por eso las mujeres sufren tanto. Esto le ponen a una mujer en la espalda durante el parto. Y aun así, hay quien dice que exageran. Esta aguja se introduce en la espalda, cerca de la columna, para ayudar a controlar el dolor durante el parto o la cesaria, pero aquí hay algo que muchas personas no terminan de entender. No es solo el momento. Muchas mujeres después siguen con molestias, punzadas, sensibilidad, rigidez. Y a veces aparecen con el frío, con el movimiento, o incluso sin razón aparente, y no es exageración. Especialistas explican que después de este tipo de procedimientos, algunas mujeres pueden sentir incomodidad durante días, semanas, o incluso más tiempo. Aún así, millones de mujeres decide usarla, porque el parto no es cualquier cosa. Es un proceso físico, intenso, doloroso, y completamente real. La verdad de todo esto es que nosotros como hombres, jamás entenderemos lo que se siente pasar por todo esto. El embarazo, las enfermedades, las descompensaciones, los miedos, los complejos, el parto o una cesaria. Y aun así, muchas deciden hacerlo por amor. Pero ante todo esto, hay algo que sí podemos hacer como hombres. Agradecerles, porque sin ellas, no estaríamos aquí."},{"month":"ABRIL","cat":"FELIPE","cat_label":"Felipe (Salud & Sociedad)","date":"12/04/2026","title":"Dile a tu hija que siga estas reglas para que no le pase nada","fb_link":"https://www.facebook.com/reel/1647255533071001","fb_views":21000000,"ig_link":"https://www.instagram.com/reel/DXDXnv0Actf/?utm\\_source=ig\\_web\\_copy\\_link\\&igsh=NTc4MTIwNjQ2YQ==","ig_views":0,"tt_link":"","tt_views":0,"total":21000000,"guion":"Dile a tu hija que siga estas reglas para que no le pase en nada. Si tienes una hija, esto te interesa. Un policía con más de 20 años de experiencia lo dice claro. ¿Quién busca ser daño? No elige a lasar. Busca aquí en va distraído. Aquí en esta solo, aquí en parece más vulnerable. Por eso, tome en cuenta estos consejos. Uno, no uses el celular mientras caminas. Porque dejas de ver lo que pasa a tu alrededor y pierdes segundos clave. Dos, evita los audífonos en la calle. Te aislan y no escuchas lo que está pasando detrás de ti. Tres, no lleves todo en el mismo lugar. Cellular, dinero, tarjetas y lo pierdes. Lo pierdes todo. Cuatro, comparte tu ubicación en tiempo real. Con alguien de confianza es simple, pero puede ayudarte mucho. Cinco, en transporte público lleva tu mochila al frente. Tienes más control y reduces riesgos. Seis, caminas siempre observando. Atenta lo que pasa alrededor. No en automático. Siete, si algo no se siente bien, confía en eso. Entre un lugar, acercate a alguien y no lo ignores. Ocho, al llegar, avisa un mensaje. Puede hacer toda la diferencia. Y no es exageración. Es prevención. Porque hay situaciones que sí se pueden evitar. Y a veces todo empieza con estar más alerta."},{"month":"ABRIL","cat":"FELIPE","cat_label":"Felipe (Salud & Sociedad)","date":"14/04/2026","title":"Qué ocurre en el cerebro cuando el fentanilo toma el control, ¿por qué se dobla el cuerpo?","fb_link":"https://www.facebook.com/share/v/1Ecf2Jqz8i/","fb_views":17000000,"ig_link":"https://www.instagram.com/badabun/reel/DXIM0oqERyx/?hl=es","ig_views":0,"tt_link":"","tt_views":0,"total":17000000,"guion":"No están dormidos, no están relajados. Cuando el fentanilo entra al cuerpo, puede hacer que el cerebro pierda el control del cuerpo y hasta de la respiración. Y lo que ves, no es una postura voluntaria, es el cerebro fallando. El fentanilo es una sustancia creada para aliviar dolores extremos, pero también actúa directo en el cerebro. No solo en el dolor, también en la respiración y en el control muscular. Cuando entra el sistema nervioso, puede provocar algo muy grave. Rigidez muscular. El cuerpo se tensa, las palas encorba, el cuello se contrai, las piernas dejan de responder, y el pecho puede ponerse tan rígido, que respirar se vuelve difícil. Por eso ves cuerpos doblados quietos imóviles. No es decisión, no es que quieran estar así. Es el cerebro perdiendo el control del cuerpo y hay algo todavía más peligroso. El fentanilo puede frenar la respiración, incluso en dosis muy pequeñas. El cuerpo deja de responder y poco a poco se apaga. En algunos casos, cuando se aplica un antídototo como la la loczona, el cuerpo puede reaccionar en segundos, la rígida es baja, la respiración regresa. Pero el problema es lo potente que es esta sustancia, porque el cuerpo genera tolerancia rapidísimo y cada vez necesita más y más y más. Hasta que un día ya no puede más. Y entender esto, cambia la forma en la que ves esas escenas, porque no es alguien descansando, es alguien perdiendo el control de su propio cuerpo."},{"month":"ABRIL","cat":"FELIPE","cat_label":"Felipe (Salud & Sociedad)","date":"16/04/2026","title":"3 frases legales que le puedes decir a un policía para que no te revise","fb_link":"https://facebook.com/reel/1543278580695668/","fb_views":10000000,"ig_link":"https://www.instagram.com/reel/DXNBlOmFRIP/?utm\\_source=ig\\_web\\_copy\\_link\\&igsh=NTc4MTIwNjQ2YQ==","ig_views":0,"tt_link":"920.000","tt_views":0,"total":10000000,"guion":"tres frases legales que le puedes decir un policía para que no te revisa. Un policía no te puede detener ni revisarte solo por qué sí, pero si no sabes cómo responder pueden aprovecharse. Estas tres frases de gales pueden protegerte. Primero, algo importante. En México no existen las revisiones de rutina. Toda revisión debe tener un motivo claro y una sospecha razonable. Y aquí es donde entran lo que dices uno. Oficial, ¿cuál es el motivo específico de la revisión? Esta pregunta obliga que justifique su acción porque no puede detenerte solo por decisión propia. Dos, ¿cuál es la sospecha razonable que lo justifica? Aquí lo llevas al terreno legal. Toda revisión debe estar basada en algo concreto. No en su posiciones. Tres, ¿me podría indicar la base legal de este procedimiento? Con respeto, pero confirme esa. Si no hay fundamento, tiene que explicarlo. Y algo más que debes saber. Tienes derecho a pedir su nombre y número de placa. Toda autoridad debe identificarse. Esto no se trata de pelear con la policía. Se trata de protegerte porque cuando conoces tus derechos, deja de reaccionar con miedo y empiezas a actuar con seguridad. La diferencia muchas veces está en lo que dices en esos primeros segundos."},{"month":"ABRIL","cat":"FELIPE","cat_label":"Felipe (Salud & Sociedad)","date":"04/04/2026","title":"Un padre entierra a su hijo en la arena todos los días. No es un castigo: es un intento para que pueda caminar","fb_link":"https://www.facebook.com/reel/951132260639566","fb_views":9300000,"ig_link":"https://www.instagram.com/badabun/reel/DWu4IZdAbsp/","ig_views":0,"tt_link":"67.000","tt_views":0,"total":9300000,"guion":""},{"month":"ABRIL","cat":"FELIPE","cat_label":"Felipe (Salud & Sociedad)","date":"14/04/2026","title":"¿Qué hacer en un retén de “policías con tenis”?","fb_link":"https://www.facebook.com/share/v/1CBCiHdSy6/","fb_views":6700000,"ig_link":"https://www.instagram.com/badabun/reel/DXIvCW-Cb1t/?hl=es","ig_views":0,"tt_link":"1.300.000","tt_views":0,"total":6700000,"guion":""},{"month":"MARZO","cat":"FELIPE","cat_label":"Felipe (Salud & Sociedad)","date":"26/03/2026","title":"3 datos del parto natural que todo hombre debe saber","fb_link":"https://facebook.com/reel/1297240811767803/","fb_views":5500000,"ig_link":"https://www.instagram.com/reel/DXnvUr0lefB/?utm\\_source=ig\\_web\\_copy\\_link","ig_views":465724,"tt_link":"https://www.tiktok.com/@badabun/video/7633213909863910676?is\\ let currentMonth = 'ENERO';

function fmtV(n) {
  if(!n || n===0) return '0';
  if(n>=1e9) return (n/1e9).toFixed(1)+'B';
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(0)+'K';
  return n.toLocaleString('es-MX');
}

function fmtDate(d) {
  if(!d) return '';
  const [day,month,year] = d.split('/');
  const mnames = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${parseInt(day)} ${mnames[parseInt(month)]} ${year}`;
}

function buildMonthNav() {
  const nav = document.getElementById('month-nav');
  const counts = {};
  ALL_DATA.forEach(e => { counts[e.month] = (counts[e.month]||0)+1; });

      ${MONTH_ES[m]||m}
      <span class="count">${counts[m]||0}</span>
    </button>
  `).join('');
}

  let topV=0, topT='';
  ALL_DATA.forEach(e => {
    fb+=e.fb_views; ig+=e.ig_views; tt+=e.tt_views;
    if(e.fb_views>topV) { topV=e.fb_views; topT=e.title; }
  });
  document.getElementById('gs-fb').textContent = fmtV(fb);
  document.getElementById('gs-ig').textContent = fmtV(ig);
  document.getElementById('gs-tt').textContent = fmtV(tt);
  document.getElementById('gs-top').textContent = fmtV(topV);
}

function selectMonth(m) {
  currentMonth = m;
  buildMonthNav();
  buildContent();
}

function buildContent() {
  const data = ALL_DATA.filter(e => e.month===currentMonth);
  const main = document.getElementById('main-content');

  // Group by category
  const grouped = {};
  data.forEach(e => {
    if(!grouped[e.cat]) grouped[e.cat]=[];
    grouped[e.cat].push(e);
  });

  // Sort each category by fb_views desc
  Object.keys(grouped).forEach(cat => {
    grouped[cat].sort((a,b) => b.fb_views - a.fb_views);
  });

  // Sort categories by total fb_views in category
  const catOrder = Object.keys(grouped).sort((a,b) => {
    const sumA = grouped[a].reduce((s,e)=>s+e.fb_views,0);
    const sumB = grouped[b].reduce((s,e)=>s+e.fb_views,0);
    return sumB - sumA;
  });

  // Month totals
  const totalFB = data.reduce((s,e)=>s+e.fb_views,0);
  const totalIG = data.reduce((s,e)=>s+e.ig_views,0);
  const totalTT = data.reduce((s,e)=>s+e.tt_views,0);
  const grandTotal = totalFB+totalIG+totalTT;

  // Find max views for bar scaling
  const maxFB = Math.max(...data.map(e=>e.fb_views), 1);
  const maxIG = Math.max(...data.map(e=>e.ig_views), 1);
  const maxTT = Math.max(...data.map(e=>e.tt_views), 1);

  let html = `
    <div class="month-summary">
      <div class="ms-title">📅 ${MONTH_ES[currentMonth]||currentMonth} 2026</div>
      <div class="ms-stat"><div class="n">${data.length}</div><div class="l">Videos</div></div>
      <div class="ms-stat"><div class="n">${fmtV(totalFB)}</div><div class="l">Views FB</div></div>
      <div class="ms-stat"><div class="n">${fmtV(totalIG)}</div><div class="l">Views IG</div></div>
      <div class="ms-stat"><div class="n">${fmtV(totalTT)}</div><div class="l">Views TT</div></div>
      <div class="ms-stat"><div class="n">${fmtV(grandTotal)}</div><div class="l">Total</div></div>
    </div>
  `;

  catOrder.forEach(cat => {
    const videos = grouped[cat];
    const catFB = videos.reduce((s,e)=>s+e.fb_views,0);
    const catLabel = CAT_LABELS[cat] || cat;
    const catVideosCount = videos.length;

    html += `<div class="cat-section">
      <div class="cat-header">
        <div class="cat-title">${catLabel}</div>
        <div class="cat-total">FB: ${fmtV(catFB)}</div>
        <div class="cat-badge">${catVideosCount} videos</div>
      </div>
      <div class="video-list">`;

    videos.forEach((v, idx) => {
      const rankCls = idx===0?'top1':idx===1?'top2':idx===2?'top3':'';
      const rankNum = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':`${idx+1}`;

      const fbPct = maxFB>0 ? Math.round((v.fb_views/maxFB)*100) : 0;
      const igPct = maxIG>0 ? Math.round((v.ig_views/maxIG)*100) : 0;
      const ttPct = maxTT>0 ? Math.round((v.tt_views/maxTT)*100) : 0;

      const fbLink = v.fb_link ? `<a class="link-btn" href="${v.fb_link}" target="_blank">🔗 Facebook</a>` : '';
      const igLink = v.ig_link && v.ig_link.startsWith('http') ? `<a class="link-btn" href="${v.ig_link}" target="_blank">🔗 Instagram</a>` : '';
      const ttLink = v.tt_link && v.tt_link.startsWith('http') ? `<a class="link-btn" href="${v.tt_link}" target="_blank">🔗 TikTok</a>` : '';

      html += `<div class="video-row">
        <div class="rank ${rankCls}">${rankNum}</div>
        <div class="video-info">
          <div class="video-title">${v.title}</div>
          <div class="video-date">📅 ${fmtDate(v.date)}</div>
          <div class="platforms">
            <div class="plat-row">
              <span class="plat-ico">📘</span>
              <span class="plat-name">Facebook</span>
              <div class="bar-wrap"><div class="bar-fill bar-fb" style="width:${fbPct}%"></div></div>
              <span class="plat-views pv-fb">${fmtV(v.fb_views)}</span>
            </div>
            <div class="plat-row">
              <span class="plat-ico">📸</span>
              <span class="plat-name">Instagram</span>
              <div class="bar-wrap"><div class="bar-fill bar-ig" style="width:${igPct}%"></div></div>
              <span class="plat-views pv-ig">${fmtV(v.ig_views)}</span>
            </div>
            <div class="plat-row">
              <span class="plat-ico">🎵</span>
              <span class="plat-name">TikTok</span>
              <div class="bar-wrap"><div class="bar-fill bar-tt" style="width:${ttPct}%"></div></div>
              <span class="plat-views pv-tt">${fmtV(v.tt_views)}</span>
            </div>
          </div>
          <div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center">${fbLink}${igLink}${ttLink}${v.guion ? `<button class="guion-btn" onclick="openGuion(event, this)" data-guion="${v.guion.replace(/"/g,'&quot;').replace(/`/g,'\\`')}" data-title="${v.title.replace(/"/g,'&quot;')}">📄 Ver Guión</button>` : ''}</div>
        </div>
        <div class="video-total">
          <div class="total-n">${fmtV(v.fb_views+v.ig_views+v.tt_views)}</div>
          <div class="total-l">Total</div>
        </div>
      </div>`;
    });

    html += `</div></div>`;
  });

  main.innerHTML = html;
}

buildGlobalStats();
buildMonthNav();
buildContent();
</script>

<!-- GUIÓN MODAL -->
<div class="modal-overlay" id="guionModal" onclick="closeGuionModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div class="modal-head-txt">
        <div class="modal-badge">📄 Guión extraído con Whisper</div>
        <div class="modal-title" id="modalTitle"></div>
      </div>
      <button class="modal-close" onclick="closeGuionModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-text" id="modalText"></div>
    </div>
    <div class="modal-foot">
      <button class="modal-copy" onclick="copyGuion()">📋 Copiar texto</button>
    </div>
  </div>
</div>
<script>
function openGuion(e, btn) {
  e.preventDefault(); e.stopPropagation();
  document.getElementById('modalTitle').textContent = btn.dataset.title;
  document.getElementById('modalText').textContent  = btn.dataset.guion;
  document.getElementById('guionModal').classList.add('open');
}
function closeGuionModal(e) {
  if (!e || e.target === document.getElementById('guionModal'))
    document.getElementById('guionModal').classList.remove('open');
}
function copyGuion() {
  const txt = document.getElementById('modalText').textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.querySelector('.modal-copy');
    btn.textContent = '✓ Copiado';
    setTimeout(() => btn.textContent = '📋 Copiar texto', 1800);
  });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeGuionModal();
});
</script>
</body>
</html>
