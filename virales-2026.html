<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f0f4ff;
  color: #1e293b;
  min-height: 100vh;
}

/* HEADER */
.header {
  background: linear-gradient(135deg, #1e0a3c 0%, #3b0764 50%, #6d28d9 100%);
  padding: 28px 32px 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 20% 50%, rgba(139,92,246,0.3) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 50%, rgba(236,72,153,0.2) 0%, transparent 60%);
}
.header-inner { position: relative; z-index: 1; }
.logo { font-size: 0.75rem; font-weight: 800; letter-spacing: 6px; color: rgba(255,255,255,0.5); text-transform: uppercase; margin-bottom: 6px; }
.header h1 { font-size: clamp(1.4rem, 4vw, 2.2rem); font-weight: 800; color: white; line-height: 1.2; }
.header h1 span { color: #c4b5fd; }
.header-sub { font-size: 0.82rem; color: rgba(255,255,255,0.5); margin-top: 6px; }

/* STATS TOP */
.stats-top {
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 16px 20px;
  background: #1e0a3c;
  flex-wrap: wrap;
}
.stb {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 8px 16px;
  text-align: center;
  min-width: 90px;
}
.stb .n { font-size: 1.3rem; font-weight: 800; color: #c4b5fd; }
.stb .l { font-size: 0.65rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.5px; }

/* MONTH TABS */
.month-nav {
  display: flex;
  gap: 0;
  background: white;
  border-bottom: 2px solid #e2e8f0;
  overflow-x: auto;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.month-tab {
  flex: 1;
  min-width: 90px;
  padding: 14px 20px;
  border: none;
  background: transparent;
  font-size: 0.88rem;
  font-weight: 600;
  color: #64748b;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
  text-align: center;
}
.month-tab:hover { color: #6d28d9; background: #faf5ff; }
.month-tab.active {
  color: #6d28d9;
  border-bottom-color: #6d28d9;
  background: #faf5ff;
}
.month-tab .count {
  display: inline-block;
  background: #e9d5ff;
  color: #6d28d9;
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 0.7rem;
  margin-left: 5px;
}
.month-tab.active .count { background: #6d28d9; color: white; }

/* MAIN */
.main { padding: 20px; max-width: 1100px; margin: 0 auto; }

/* MONTH SUMMARY */
.month-summary {
  background: white;
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 20px;
  border: 1px solid #e2e8f0;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.ms-title { font-size: 1.1rem; font-weight: 700; color: #1e0a3c; flex: 1; min-width: 150px; }
.ms-stat { text-align: center; }
.ms-stat .n { font-size: 1.2rem; font-weight: 800; color: #6d28d9; }
.ms-stat .l { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; }

/* CATEGORY SECTION */
.cat-section { margin-bottom: 28px; }
.cat-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: linear-gradient(135deg, #1e0a3c, #3b0764);
  border-radius: 12px 12px 0 0;
  color: white;
}
.cat-title { font-size: 1rem; font-weight: 700; flex: 1; }
.cat-badge {
  background: rgba(255,255,255,0.15);
  border-radius: 8px;
  padding: 3px 10px;
  font-size: 0.75rem;
  color: #e9d5ff;
}
.cat-total {
  font-size: 0.75rem;
  color: #c4b5fd;
}

/* VIDEO CARD */
.video-list { background: white; border-radius: 0 0 12px 12px; border: 1px solid #e2e8f0; border-top: none; overflow: hidden; }
.video-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid #f1f5f9;
  transition: background 0.15s;
}
.video-row:last-child { border-bottom: none; }
.video-row:hover { background: #faf5ff; }

.rank {
  font-size: 1.1rem;
  font-weight: 800;
  color: #d1d5db;
  min-width: 28px;
  text-align: center;
  padding-top: 2px;

.rank.top1 { color: #f59e0b; }
.rank.top2 { color: #94a3b8; }
.rank.top3 { color: #cd7c2a; }

.video-info { flex: 1; min-width: 0; }
.video-title {
  font-size: 0.9rem;
  font-weight: 600;
  color: #0f172a;
  line-height: 1.4;
  margin-bottom: 6px;
}
.video-date { font-size: 0.72rem; color: #94a3b8; margin-bottom: 8px; }

/* PLATFORM BARS */
.platforms { display: flex; flex-direction: column; gap: 5px; }
.plat-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.plat-ico {
  font-size: 0.8rem;
  min-width: 20px;
  text-align: center;
}
.plat-name {
  font-size: 0.7rem;
  color: #64748b;
  min-width: 75px;
  font-weight: 500;
}
.bar-wrap {
  flex: 1;
  background: #f1f5f9;
  border-radius: 3px;
  height: 6px;
  overflow: hidden;
  min-width: 60px;
}
.bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s;
}
.bar-fb { background: linear-gradient(90deg, #1877f2, #42a5f5); }
.bar-ig { background: linear-gradient(90deg, #e1306c, #f77737); }
.bar-tt { background: linear-gradient(90deg, #000000, #69c9d0); }
.plat-views {
  font-size: 0.72rem;
  font-weight: 700;
  min-width: 55px;
  text-align: right;
}
.pv-fb { color: #1877f2; }
.pv-ig { color: #e1306c; }
.pv-tt { color: #010101; }

/* TOTAL VIEWS */
.video-total {
  text-align: right;
  min-width: 80px;
}
.total-n { font-size: 1.1rem; font-weight: 800; color: #6d28d9; }
.total-l { font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; }

.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 0.68rem;
  color: #16a34a;
  text-decoration: none;
  margin-top: 4px;
  transition: all 0.15s;
}
.link-btn:hover { background: #16a34a; color: white; border-color: #16a34a; }

/* EMPTY */
.empty { text-align: center; padding: 40px; color: #94a3b8; }

/* RESPONSIVE */
@media (max-width: 600px) {
  .header { padding: 20px 16px; }
  .main { padding: 12px; }
  .video-total { display: none; }
  .plat-name { min-width: 55px; }
}
</style>

let currentMonth = 'ENERO';

function fmtV(n) {
  if(!n || n===0) return '0';
  if(n>=1e9) return (n/1e9).toFixed(1)+'B';
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(0)+'K';
  return n.toLocaleString('es-MX');
}

function fmtDate(d) {
  if(!d) return '';
  const [day,month,year] = d.split('/');
  const mnames = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return `${parseInt(day)} ${mnames[parseInt(month)]} ${year}`;
}

function buildMonthNav() {
  const nav = document.getElementById('month-nav');
  const counts = {};
  ALL_DATA.forEach(e => { counts[e.month] = (counts[e.month]||0)+1; });
  nav.innerHTML = MONTHS_ORDER.map(m => `
    <button class="month-tab ${m===currentMonth?'active':''}" onclick="selectMonth('${m}')">
      ${MONTH_ES[m]||m}
      <span class="count">${counts[m]||0}</span>
    </button>
  `).join('');
}

function buildGlobalStats() {
  let fb=0, ig=0, tt=0;
  let topV=0, topT='';
  ALL_DATA.forEach(e => {
    fb+=e.fb_views; ig+=e.ig_views; tt+=e.tt_views;
    if(e.fb_views>topV) { topV=e.fb_views; topT=e.title; }
  });
  document.getElementById('gs-fb').textContent = fmtV(fb);
  document.getElementById('gs-ig').textContent = fmtV(ig);
  document.getElementById('gs-tt').textContent = fmtV(tt);
  document.getElementById('gs-top').textContent = fmtV(topV);
}

function selectMonth(m) {
  currentMonth = m;
  buildMonthNav();
  buildContent();
}

function buildContent() {
  const data = ALL_DATA.filter(e => e.month===currentMonth);
  const main = document.getElementById('main-content');

  // Group by category
  const grouped = {};
  data.forEach(e => {
    if(!grouped[e.cat]) grouped[e.cat]=[];
    grouped[e.cat].push(e);
  });

  // Sort each category by fb_views desc
  Object.keys(grouped).forEach(cat => {
    grouped[cat].sort((a,b) => b.fb_views - a.fb_views);
  });

  // Sort categories by total fb_views in category
  const catOrder = Object.keys(grouped).sort((a,b) => {
    const sumA = grouped[a].reduce((s,e)=>s+e.fb_views,0);
    const sumB = grouped[b].reduce((s,e)=>s+e.fb_views,0);
    return sumB - sumA;
  });

  // Month totals
  const totalFB = data.reduce((s,e)=>s+e.fb_views,0);
  const totalIG = data.reduce((s,e)=>s+e.ig_views,0);
  const totalTT = data.reduce((s,e)=>s+e.tt_views,0);
  const grandTotal = totalFB+totalIG+totalTT;

  // Find max views for bar scaling
  const maxFB = Math.max(...data.map(e=>e.fb_views), 1);
  const maxIG = Math.max(...data.map(e=>e.ig_views), 1);
  const maxTT = Math.max(...data.map(e=>e.tt_views), 1);

  let html = `
    <div class="month-summary">
      <div class="ms-title">📅 ${MONTH_ES[currentMonth]||currentMonth} 2026</div>
      <div class="ms-stat"><div class="n">${data.length}</div><div class="l">Videos</div></div>
      <div class="ms-stat"><div class="n">${fmtV(totalFB)}</div><div class="l">Views FB</div></div>
      <div class="ms-stat"><div class="n">${fmtV(totalIG)}</div><div class="l">Views IG</div></div>
      <div class="ms-stat"><div class="n">${fmtV(totalTT)}</div><div class="l">Views TT</div></div>
      <div class="ms-stat"><div class="n">${fmtV(grandTotal)}</div><div class="l">Total</div></div>
    </div>
  `;

  catOrder.forEach(cat => {
    const videos = grouped[cat];
    const catFB = videos.reduce((s,e)=>s+e.fb_views,0);
    const catLabel = CAT_LABELS[cat] || cat;
    const catVideosCount = videos.length;

    html += `<div class="cat-section">
      <div class="cat-header">
        <div class="cat-title">${catLabel}</div>
        <div class="cat-total">FB: ${fmtV(catFB)}</div>
        <div class="cat-badge">${catVideosCount} videos</div>
      </div>
      <div class="video-list">`;

    videos.forEach((v, idx) => {
      const rankCls = idx===0?'top1':idx===1?'top2':idx===2?'top3':'';
      const rankNum = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':`${idx+1}`;

      const fbPct = maxFB>0 ? Math.round((v.fb_views/maxFB)*100) : 0;
      const igPct = maxIG>0 ? Math.round((v.ig_views/maxIG)*100) : 0;
      const ttPct = maxTT>0 ? Math.round((v.tt_views/maxTT)*100) : 0;

      const fbLink = v.fb_link ? `<a class="link-btn" href="${v.fb_link}" target="_blank">🔗 Facebook</a>` : '';
      const igLink = v.ig_link && v.ig_link.startsWith('http') ? `<a class="link-btn" href="${v.ig_link}" target="_blank">🔗 Instagram</a>` : '';
      const ttLink = v.tt_link && v.tt_link.startsWith('http') ? `<a class="link-btn" href="${v.tt_link}" target="_blank">🔗 TikTok</a>` : '';

      html += `<div class="video-row">
        <div class="rank ${rankCls}">${rankNum}</div>
        <div class="video-info">
          <div class="video-title">${v.title}</div>
          <div class="video-date">📅 ${fmtDate(v.date)}</div>
          <div class="platforms">
            <div class="plat-row">
              <span class="plat-ico">📘</span>
              <span class="plat-name">Facebook</span>
              <div class="bar-wrap"><div class="bar-fill bar-fb" style="width:${fbPct}%"></div></div>
              <span class="plat-views pv-fb">${fmtV(v.fb_views)}</span>
            </div>
            <div class="plat-row">
              <span class="plat-ico">📸</span>
              <span class="plat-name">Instagram</span>
              <div class="bar-wrap"><div class="bar-fill bar-ig" style="width:${igPct}%"></div></div>
              <span class="plat-views pv-ig">${fmtV(v.ig_views)}</span>
            </div>
            <div class="plat-row">
              <span class="plat-ico">🎵</span>
              <span class="plat-name">TikTok</span>
              <div class="bar-wrap"><div class="bar-fill bar-tt" style="width:${ttPct}%"></div></div>
              <span class="plat-views pv-tt">${fmtV(v.tt_views)}</span>
            </div>
          </div>
          <div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">${fbLink}${igLink}${ttLink}</div>
        </div>
        <div class="video-total">
          <div class="total-n">${fmtV(v.fb_views+v.ig_views+v.tt_views)}</div>
          <div class="total-l">Total</div>
        </div>
      </div>`;
    });

    html += `</div></div>`;
  });

  main.innerHTML = html;
}

buildGlobalStats();
buildMonthNav();
buildContent();
